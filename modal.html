<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-gray-100">
    <!-- Trigger Button -->
    <button
      id="openModal"
      class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700"
    >
      Open Modal
    </button>

    <!-- Modal Overlay -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black bg-opacity-50">
      <!-- Centering Container -->
      <div class="flex items-center justify-center h-full">
        <!-- Modal Box -->
        <div class="bg-white px-1 py-8 rounded-xl shadow-lg text-center">
          <h2 class="mb-4 font-bold text-[25px]">Congrates!</h2>
          <p class="flex items-center justify-center"><img src="assets/coin.png" alt=""></p>
          <p class="mb-4">You Have Donated for Humankind</p>
          <h2>Successfully</h2>
          <button
            id="closeModal"
            class="px-4 py-2 text-white bg-[#C4C4C4] rounded hover:bg-red-600 mt-4"
          >
            Close Confirmation
          </button>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script>
      const openBtn = document.getElementById("openModal");
      const closeBtn = document.getElementById("closeModal");
      const modal = document.getElementById("modal");

      openBtn.addEventListener("click", () => modal.classList.remove("hidden"));
      closeBtn.addEventListener("click", () => modal.classList.add("hidden"));

      // Optional: Click outside to close
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
